<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>&lt;depth-viewer&gt; — 管线三图对比</title>
<style>
body{margin:0;background:#0b0b0f;color:#eee;font:14px/1.6 system-ui;padding:20px}
h1{font-size:16px;font-weight:600;margin:0 0 4px}
.tip{color:#888;font-size:12px;margin-bottom:16px}
#switch{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
#switch button{background:#17171d;border:1px solid #2a2a33;color:#ccc;padding:7px 14px;
border-radius:8px;font:13px system-ui;cursor:pointer;transition:all .15s}
#switch button:hover{border-color:#8ab4ff;color:#fff}
#switch button.on{background:#1e3a5f;border-color:#8ab4ff;color:#fff}
.stage depth-viewer{width:100%;max-width:760px;height:80vh;border-radius:12px;outline:1px solid #222;display:block;margin:0 auto}
</style></head><body>
<h1>&lt;depth-viewer&gt; — CVPR20 管线三图（单面板切换）</h1>
<div class="tip">点击按钮切换（按需加载 66MB）· 滚轮变焦 · 鼠标环视 · 悬停按 <code>I</code> 补全区高亮 · <code>F</code> 翻转</div>
<div id="switch">
  <button data-m="e1d28550" class="on">1 · e1d28550</button>
  <button data-m="w167-2">2 · 白衣vs橙椅</button>
  <button data-m="w167-3">3 · 三层纵深</button>
  <button data-m="w167-3-v3">4 · v3 物体刚体化</button>
</div>
<div class="stage">
  <depth-viewer id="main" mesh-src="./img/mesh/e1d28550"></depth-viewer>
</div>
<script>
// 同源 vendor 模式: 绕开 CDN 依赖（内网/受限 webview 也能跑全实时模式）——全部绝对 URL
globalThis.__DEPTH_VIEWER_TFS__ = new URL('./vendor/dist/transformers.min.js', location.href).href
globalThis.__DEPTH_VIEWER_LOCAL_MODELS__ = new URL('./models/', location.href).href
globalThis.__DEPTH_VIEWER_WASM__ = new URL('./vendor/dist/', location.href).href
</script>
<script src="../dist/depth-component/depth-viewer.js"></script>
<script>
const w = document.getElementById('main');
document.getElementById('switch').addEventListener('click', (e) => {
  const m = e.target.dataset && e.target.dataset.m;
  if (!m) return;
  w.setAttribute('mesh-src', './img/mesh/' + m);
  document.querySelectorAll('#switch button').forEach(b => b.classList.toggle('on', b === e.target));
});
</script>
</body></html>
