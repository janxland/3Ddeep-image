<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>3D 景深壁纸</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
depth-viewer{width:100vw;height:100vh;display:block}
#switch{position:fixed;right:14px;bottom:12px;z-index:10;display:flex;gap:6px;opacity:.35;transition:opacity .3s}
#switch:hover{opacity:.9}
#switch button{background:rgba(255,255,255,.12);border:0;color:#fff;width:26px;height:26px;
border-radius:50%;font:12px system-ui;cursor:pointer}
#switch button.on{background:rgba(120,180,255,.55)}
</style></head><body>
<depth-viewer id="w" mesh-src="./img/mesh/e1d28550"></depth-viewer>
<div id="switch">
  <button class="on" data-m="e1d28550">1</button>
  <button data-m="w167-2">2</button>
  <button data-m="w167-3">3</button>
</div>
<script src="../dist/depth-component/depth-viewer.js"></script>
<script>
// 全屏壁纸: 单演示铺满视口, 渲染器天然按图片比例 contain(不变形), 黑边为壁纸自然留白
const w = document.getElementById('w');
document.getElementById('switch').addEventListener('click', (e) => {
  const m = e.target.dataset && e.target.dataset.m;
  if (!m) return;
  w.setAttribute('mesh-src', './img/mesh/' + m);
  document.querySelectorAll('#switch button').forEach(b => b.classList.toggle('on', b === e.target));
});
</script>
</body></html>
